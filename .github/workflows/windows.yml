name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure MSVC x64
        run: cmake --preset windows-x64
      - name: Build portable executable and tests
        run: cmake --build --preset release
      - name: Test grouping and volume model
        run: ctest --preset release
      - name: Package
        shell: pwsh
        run: |
          cmake --install build/windows-x64 --config Release --prefix dist/portable
          Compress-Archive -Path dist/portable/* -DestinationPath dist/TinyVolumeMixer-windows-x64.zip
          $hash = (Get-FileHash dist/TinyVolumeMixer-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TinyVolumeMixer-windows-x64.zip" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: TinyVolumeMixer-windows-x64
          path: |
            dist/TinyVolumeMixer-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: TinyVolumeMixer-windows-x64
          path: release
      - name: Publish tagged portable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          --verify-tag --title "TinyVolumeMixer $RELEASE_TAG" --generate-notes
          release/TinyVolumeMixer-windows-x64.zip release/SHA256SUMS.txt
